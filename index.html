<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>精神科病棟 身体急変サポート</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#23395b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="急変サポート">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<style>
:root{
  /* layout: 固定ヘッダー（判定の帯・日中/夜間・ステップ帯）→ 1ステップずつの記入面 → 下部ナビ。判定の帯は常に見える */
  --paper:#eef1f5; --surface:#ffffff; --ink:#152033; --muted:#596579; --line:#d2d9e3;
  --accent:#23395b; --accent-soft:#e2e8f2; --on-accent:#ffffff;
  --ok:#2a7a4b; --ok-soft:#e1f1e7; --warn:#8f5b00; --warn-soft:#fbefd9; --crit:#b3261e; --crit-soft:#fbe3e0; --night:#3d3a73; --night-soft:#e7e6f6;
  --body:"Hiragino Sans","Yu Gothic UI","Yu Gothic",system-ui,sans-serif;
  --serif:"Hiragino Mincho ProN","Yu Mincho",serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0f141b; --surface:#18202a; --ink:#e5eaf1; --muted:#97a3b4; --line:#2b3644;
  --accent:#9db6dc; --accent-soft:#1f2d40; --on-accent:#0d1520;
  --ok:#70c896; --ok-soft:#15301f; --warn:#e3b55e; --warn-soft:#372a12; --crit:#f2877d; --crit-soft:#3d1a18; --night:#b3afef; --night-soft:#25233f; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f141b; --surface:#18202a; --ink:#e5eaf1; --muted:#97a3b4; --line:#2b3644;
  --accent:#9db6dc; --accent-soft:#1f2d40; --on-accent:#0d1520;
  --ok:#70c896; --ok-soft:#15301f; --warn:#e3b55e; --warn-soft:#372a12; --crit:#f2877d; --crit-soft:#3d1a18; --night:#b3afef; --night-soft:#25233f; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top) + 8px) max(14px,env(safe-area-inset-right)) 0 max(14px,env(safe-area-inset-left))}
.in{max-width:760px;margin:0 auto}
.top{display:flex;align-items:center;gap:6px}
h1{font-family:var(--serif);font-size:16px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 9px;font-size:13px;cursor:pointer;white-space:nowrap}
.hb.code{background:var(--crit);border-color:var(--crit);color:#fff;font-weight:700}
.hb.mode{font-weight:700}
.hb.mode.night{background:var(--night);border-color:var(--night);color:#fff}
.band{margin:6px 0 0;border-radius:8px;padding:6px 10px;font-size:13px;font-weight:700;display:flex;gap:8px;align-items:center;justify-content:space-between}
.band small{font-weight:400}
.lv3{background:var(--crit);color:#fff} .lv2{background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn)} .lv1{background:var(--ok-soft);color:var(--ok)} .lv0{background:var(--accent-soft);color:var(--muted)}
#steps{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-top:4px}
#steps::-webkit-scrollbar{display:none}
.st{flex:0 0 auto;border:0;background:none;padding:6px 9px 8px;border-bottom:3px solid transparent;color:var(--muted);font-size:13px;cursor:pointer;white-space:nowrap}
.st .n{font-size:11px;margin-right:3px}
.st[aria-current="step"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:700}
main{max-width:760px;margin:0 auto;padding:14px max(14px,env(safe-area-inset-right)) calc(100px + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));display:grid;gap:12px}
h2{font-family:var(--serif);font-size:22px;margin:0}
.lead{margin:0;color:var(--muted);font-size:13px}
.block{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:13px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.block>h3{grid-column:1/-1;font-size:13px;letter-spacing:.05em;color:var(--muted);margin:0;padding-bottom:5px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}
.wide{grid-column:1/-1}
.fld{display:grid;gap:5px;align-content:start}
.lab{font-size:13px;font-weight:700}
input,select,textarea{font-size:16px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--paper);width:100%}
textarea{resize:vertical;line-height:1.5}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{font-size:14px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;min-height:36px;line-height:1.3;text-align:left}
.opt.chip{border-radius:999px}
.opt[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.opt.red[aria-pressed="true"]{background:var(--crit);border-color:var(--crit);color:#fff}
.opt.amb[aria-pressed="true"]{background:var(--warn);border-color:var(--warn);color:#fff}
.opt.grn[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.note{font-size:12px;color:var(--muted);margin:0}
.alert{border-left:4px solid var(--line);padding:7px 11px;border-radius:6px;font-size:14px;line-height:1.5}
.a-crit{background:var(--crit-soft);border-left-color:var(--crit)} .a-warn{background:var(--warn-soft);border-left-color:var(--warn)}
.a-ok{background:var(--ok-soft);border-left-color:var(--ok)} .a-info{background:var(--accent-soft);border-left-color:var(--accent)} .a-night{background:var(--night-soft);border-left-color:var(--night)}
.list{display:grid;gap:8px}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.p-crit{background:var(--crit-soft);color:var(--crit)} .p-warn{background:var(--warn-soft);color:var(--warn)} .p-ok{background:var(--ok-soft);color:var(--ok)} .p-info{background:var(--accent-soft);color:var(--accent)} .p-none{background:var(--paper);color:var(--muted)} .p-night{background:var(--night-soft);color:var(--night)}
.sym{border:1px solid var(--line);border-radius:10px;padding:11px;display:grid;gap:9px;background:var(--surface)}
.sym>.t{font-weight:700;font-size:16px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.grp{display:grid;gap:5px}
.grp .g{font-size:12px;font-weight:700;color:var(--muted)}
.grp .g.r{color:var(--crit)} .grp .g.y{color:var(--warn)} .grp .g.gr{color:var(--ok)}
.vt{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.vt th,.vt td{border-bottom:1px solid var(--line);padding:5px 4px;text-align:center;white-space:nowrap}
.vt th{font-size:11px;color:var(--muted)}
.vt td.s1{background:var(--warn-soft)} .vt td.s2{background:#f6d9a8} .vt td.s3{background:var(--crit-soft);color:var(--crit);font-weight:700}
.scroll{overflow-x:auto}
.vrow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:420px){.vrow{grid-template-columns:repeat(2,1fr)}}
.big{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.kv{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center}
.trow{display:grid;grid-template-columns:auto 1fr auto;gap:6px 8px;align-items:center;font-size:14px}
.trow .opt{padding:3px 9px;min-height:28px;font-size:12px}
ul.b{margin:0;padding-left:1.2em;font-size:14px}
.ddx{display:grid;grid-template-columns:1fr auto;gap:4px 8px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)}
.ddx .nm{font-weight:700;font-size:14px}.ddx .cl{grid-column:1/-1;font-size:12px;color:var(--muted)}
.ddx .opts .opt{padding:3px 8px;min-height:28px;font-size:12px}
.rowbtns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lnk{background:none;border:1px dashed var(--line);border-radius:8px;padding:7px 11px;cursor:pointer;color:var(--accent);font-size:14px}
.del{background:none;border:0;color:var(--crit);font-size:13px;cursor:pointer}
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:8px max(14px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
nav.bottom .in{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:8px}
nav.bottom button{padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:14px}
nav.bottom .mid{background:var(--accent-soft);border-color:transparent;color:var(--accent);font-weight:700}
nav.bottom button:disabled{opacity:.4}
.modal{position:fixed;inset:0;z-index:40;background:rgba(8,12,18,.55);display:flex;align-items:flex-end;justify-content:center}
.modal[hidden]{display:none}
.panel{background:var(--surface);width:100%;max-width:680px;max-height:90%;overflow:auto;border-radius:14px 14px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));display:grid;gap:12px}
@media (min-width:700px){.modal{align-items:center}.panel{border-radius:14px}}
.panel h3{margin:0;font-family:var(--serif);font-size:19px}
.panel textarea.out{min-height:46vh;font-size:13px}
.ep{display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--line);padding:8px 0}
.ep .nm{flex:1;min-width:0}.ep small{display:block;color:var(--muted);font-size:12px}
footer{font-size:12px;color:var(--muted);line-height:1.6}
@media (prefers-reduced-motion:no-preference){.opt,.st{transition:background-color .12s,color .12s}}
</style>
</head>
<body>
<header>
  <div class="in">
    <div class="top">
      <h1>身体急変サポート</h1>
      <button type="button" class="hb code" data-act="code">心停止・窒息</button>
      <button type="button" class="hb mode" id="modeBtn" data-act="mode"></button>
      <button type="button" class="hb" data-act="eps">記録</button>
    </div>
    <div class="band lv0" id="band" role="status"></div>
    <nav id="steps" aria-label="段階"></nav>
  </div>
</header>
<main id="main"></main>
<nav class="bottom" aria-label="ページ移動"><div class="in">
  <button type="button" id="prevBtn" data-act="prev">← 前へ</button>
  <button type="button" class="mid" data-act="report">報告・転院用の文書</button>
  <button type="button" id="nextBtn" data-act="next">次へ →</button>
</div></nav>
<div class="modal" id="modal" hidden><div class="panel" role="dialog" aria-modal="true" id="panel"></div></div>
<script src="data.js"></script>
<script src="app.js"></script>
<script>
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost') && !/claude\.ai|claudeusercontent/.test(location.hostname)) {
  try { navigator.serviceWorker.register('sw.js').catch(function(){}); } catch (e) {}
}
</script>
</body>
</html>
